name: CI

on:
  push:
    branches: [main, features, deployment]
  pull_request:
    branches: [main, features, deployment]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Lint with ruff
        run: |
          ruff check app tests evals
          ruff format --check app tests evals

      - name: Test with pytest
        env:
          LOGFIRE_IGNORE_NO_CONFIG: 1
          JINA_API_KEY: dummy
          GEMINI_API_KEY: dummy
          OPENAI_API_KEY: dummy
          QDRANT_URL: https://dummy.example.com
          NEON_DB_URL: postgres://dummy:dummy@dummy.db:5432/dummy
          UPSTASH_REDIS_REST_URL: https://dummy.example.com
          UPSTASH_REDIS_REST_TOKEN: dummy
          PORTKEY_API_KEY: dummy
          PORTKEY_PRIMARY_SLUG: dummy-primary
          PORTKEY_FALLBACK_SLUG: dummy-fallback
          PORTKEY_PRIMARY_CONFIG_ID: dummy-config
        run: |
          python -m pytest tests/

  frontend:
    name: Validate Next.js frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
